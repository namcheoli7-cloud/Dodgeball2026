<style>
:root{
  --court-bg:#f3f4f6;
  --panel:#ffffff;
  --panel-2:#eef0f3;
  --line:#dde1e6;
  --chalk:#1a1f27;
  --chalk-dim:#6b7684;
  --out-orange:#ff7a1a;
  --out-orange-dim:#e06510;
  --in-green:#149457;
  --draw-blue:#2563a8;
  --danger:#d9363e;
  --court-yellow:#f4c430;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--court-bg);
  color:var(--chalk);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  min-height:100vh;
  word-break:keep-all;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(255,122,26,0.06), transparent 55%);
}
.mono{font-family:'Consolas','SF Mono',monospace;}
.score-input::-webkit-outer-spin-button,
.score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.score-input{-moz-appearance:textfield;}
h1,h2,h3{font-family:'Segoe UI',sans-serif;letter-spacing:0.02em;margin:0;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px;}

/* ---- landing ---- */
.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;text-align:center;padding:20px;}
.court-mark{width:160px;height:100px;position:relative;}
.court-mark svg{width:100%;height:100%;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;}
.landing .card{width:100%;max-width:380px;}
input,select,button{font-family:inherit;font-size:15px;}
input[type=text],input[type=password],input[type=number]{
  width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);
  background:var(--court-bg);color:var(--chalk);margin-bottom:10px;
}
input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--out-orange);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--chalk);cursor:pointer;font-weight:600;
  transition:background .15s, transform .1s;
}
.btn:hover{background:#e4e7ec;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--out-orange);border-color:var(--out-orange);color:#1a0f00;}
.btn-primary:hover{background:#ff8c3d;}
.btn-block{width:100%;margin-top:4px;}
.btn-sm{padding:5px 10px;font-size:13px;}
.btn-ghost{background:transparent;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.hr-label{display:flex;align-items:center;gap:10px;color:var(--chalk-dim);font-size:12px;margin:14px 0;}
.hr-label::before,.hr-label::after{content:'';flex:1;height:1px;background:var(--line);}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(243,244,246,0.92);backdrop-filter:blur(6px);z-index:20;}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--out-orange);flex-shrink:0;}
.role-badge{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--chalk-dim);}
.role-badge.admin{border-color:var(--out-orange);color:var(--out-orange);}

/* ---- tabs ---- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--chalk-dim);cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px;}
.tab.active{background:var(--out-orange);color:#1a0f00;border-color:var(--out-orange);}

/* ---- hero ---- */
.hero{text-align:center;padding:18px 10px 8px;}
.hero-ball{width:64px;height:64px;margin:0 auto 12px;}
.hero-ball svg{width:100%;height:100%;}
.hero-title{font-size:30px;font-weight:900;letter-spacing:0.01em;line-height:1.25;margin:0 0 8px;}
.hero-title .accent{color:var(--out-orange);}
.hero-sub{color:var(--chalk-dim);font-size:14px;}
@media (max-width:640px){ .hero-title{font-size:24px;} .hero-ball{width:52px;height:52px;} }

/* ---- groups / setup ---- */
.section-title{font-size:15px;font-weight:800;margin:22px 0 10px;color:var(--chalk);display:flex;align-items:center;gap:8px;}
.section-title .n{color:var(--out-orange);}
.group-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
.group-card .ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:4px;}
.group-card .gname{font-weight:800;font-size:14px;}
.group-teams{display:flex;flex-wrap:wrap;gap:6px;}
.group-team-tag{padding:6px 11px;border-radius:5px;background:var(--panel-2);font-size:13.5px;border:1px solid var(--line);}

/* ---- matches ---- */
.match-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.match-group-label{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.05em;}
.status-pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--chalk-dim);}
.status-pill.done{border-color:var(--in-green);color:var(--in-green);}
.status-pill.live{border-color:var(--out-orange);color:var(--out-orange);}
.teams-row{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:800;font-size:18px;margin-bottom:10px;}
.teams-row .vs{color:var(--chalk-dim);font-size:12px;font-weight:400;}
.teams-row .tname{flex:1;text-align:center;}
.teams-row .tname.winner{color:var(--in-green);}
.sets-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.set-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:100px;text-align:center;}
.set-box .set-label{font-size:10px;color:var(--chalk-dim);margin-bottom:6px;letter-spacing:0.05em;}
.match-actions{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}

/* ---- standings ---- */
table.standings{width:100%;border-collapse:collapse;font-size:14.5px;}
table.checklist-table thead th{position:sticky;top:76px;background:var(--panel);z-index:5;box-shadow:0 1px 0 var(--line);}
@media (min-width:641px){ table.checklist-table thead th{top:57px;} }
table.standings th{text-align:left;color:var(--chalk-dim);font-weight:700;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:0.04em;}
table.standings td{padding:8px;border-bottom:1px solid var(--line);}
table.standings tr.advance td{background:rgba(20,148,87,0.10);border-top:1.5px solid rgba(20,148,87,0.4);border-bottom:1.5px solid rgba(20,148,87,0.4);}
table.standings tr.advance td:first-child{border-left:3px solid var(--in-green);}
table.standings tr.advance td:nth-child(2){color:var(--in-green);font-weight:700;}
table.standings td.rank{color:var(--out-orange);font-weight:800;width:26px;}
.reorder-btns{display:flex;gap:2px;}
.reorder-btns button{padding:2px 6px;font-size:10px;}

.division-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;}
.group-picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px;}
.division-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;}
.division-card:hover{border-color:var(--out-orange);}
.division-card .dtitle{font-weight:800;font-size:15px;margin-bottom:4px;}
.division-card .dmeta{font-size:12px;color:var(--chalk-dim);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--out-orange);color:var(--chalk);padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.small-note{font-size:12px;color:var(--chalk-dim);margin-top:4px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--chalk-dim);}
.empty-state .big{font-size:34px;margin-bottom:8px;}
</style>
</head>

function stageDateVenueText(k, stageDef, div){
  const date = (DIVISION_STAGE_DATES[k]||{})[stageDef.key];
  if(!date) return '';
  const pools = Object.values((div&&div.pools)||{}).filter(p=>p.stage===stageDef.key);
  const venues = [...new Set(pools.map(p=>p.venue).filter(Boolean))];
  if(venues.length===1) return `${date} · ${venues[0]}`;
  return date;
}

// 프리셋 기준으로 조편성+팀배정+예선대진까지 한번에 만드는 빌더 (1단계만 실제 생성, 이후 단계는 진출 확정 시 생성)
function buildDivisionData(k){
  const p = DIVISION_PRESETS[k];
  const stages = DIVISION_STAGES[k];
  const teams = {};
  p.teams.forEach((t,i)=>{ teams['t'+i+'_'+k] = { name:t }; });
  const nameToId = {};
  Object.entries(teams).forEach(([id,t])=>{ nameToId[t.name]=id; });

  const pools = {};
  stages.forEach(stageDef=>{
    (PRESET_POOLS[k][stageDef.key]||[]).forEach(pd=>{
      pools[pd.id] = { name:pd.name, venue:pd.venue, stage:stageDef.key, teams: pd.teams.map(n=>nameToId[n]).filter(Boolean) };
    });
  });

  const matches = {};
  const stage1 = stages[0];
  (PRESET_MATCHES[k][stage1.key]||[]).forEach((row,idx)=>{
    const [aName,bName,time,venue,poolId] = row;
    const mid = 'm_'+stage1.key+'_'+idx;
    matches[mid] = {
      poolId, teamA:nameToId[aName]||null, teamB:nameToId[bName]||null,
      sets:{}, setsToPlay:stage1.sets, drawAllowed:stage1.drawAllowed,
      stage:stage1.key, time, court:venue, date: (DIVISION_STAGE_DATES[k]||{})[stage1.key]||'',
      status:'scheduled', createdAt: idx
    };
  });

  return { label:p.label, pools, teams, matches };
}

  const team = div.teams && div.teams[teamId];
  if(!team) return;
  const myPools = Object.entries(div.pools||{}).filter(([id,p])=>(p.teams||[]).includes(teamId));
  const poolLabel = myPools.map(([id,p])=>p.name).join(', ');

  let rows = [];
  Object.entries(div.matches||{}).forEach(([mid,m])=>{
    if(m.teamA===teamId || m.teamB===teamId){
      const isA = m.teamA===teamId;
      const oppId = isA ? m.teamB : m.teamA;
      const stageDef = (DIVISION_STAGES[k]||[]).find(s=>s.key===m.stage);
      const label = (stageDef && stageDef.key!=='league') ? stageDef.label : '';
      rows.push({ label, time:m.time, court:m.court, m, isA, oppName: oppId?teamName(div,oppId):'미정' });
    }
  });
  rows.sort((a,b)=>{
    const ta=parseTimeToMinutes(a.time), tb=parseTimeToMinutes(b.time);
    if(ta!==null && tb!==null && ta!==tb) return ta-tb;
    if(ta!==null && tb===null) return -1;
    if(ta===null && tb!==null) return 1;
    return 0;
  });

  let bodyHtml = '';
  if(rows.length===0){
    bodyHtml = `<div class="small-note">아직 배정된 경기가 없습니다.</div>`;
  } else {
    rows.forEach((r,idx)=>{
      const st = matchStats(r.m);
      const winsSelf = r.isA ? st.winsA : st.winsB;
      const winsOpp = r.isA ? st.winsB : st.winsA;
      let statusLabel='예정', color='var(--chalk-dim)';
      if(st.played>0 && !st.decided){ statusLabel='진행중'; color='var(--out-orange)'; }
      if(st.decided && st.played>0){
        if(winsSelf>winsOpp){ statusLabel='승 '+winsSelf+':'+winsOpp; color='var(--in-green)'; }
        else if(winsOpp>winsSelf){ statusLabel='패 '+winsSelf+':'+winsOpp; color='var(--danger)'; }
        else { statusLabel='무 '+winsSelf+':'+winsOpp; color='var(--draw-blue)'; }
      }
      bodyHtml += `<div class="match-card" style="margin-bottom:8px;">
        <div class="match-top">
          <span class="match-group-label">${[r.label,(idx+1)+'경기',r.court].filter(Boolean).join(' · ')}</span>
          <span class="status-pill" style="border-color:${color};color:${color};">${statusLabel}</span>
        </div>
        <div class="teams-row" style="font-size:14px;"><span class="tname">${team.name}</span><span class="vs">VS</span><span class="tname">${r.oppName}</span></div>
      </div>`;
    });
  }

  const overlay = document.createElement('div');
  overlay.style.position='fixed'; overlay.style.inset='0'; overlay.style.background='rgba(18,21,27,0.92)'; overlay.style.zIndex='65';
  overlay.style.display='flex'; overlay.style.alignItems='center'; overlay.style.justifyContent='center'; overlay.style.padding='20px';
  overlay.innerHTML = `<div class="card" style="max-width:420px;width:100%;max-height:80vh;overflow-y:auto;">
    <div class="flex-between" style="margin-bottom:12px;">
      <strong style="font-size:16px;">${team.name}${poolLabel?' · '+poolLabel:''}</strong>
      <button class="btn btn-ghost btn-sm" onclick="this.closest('div[style*=fixed]').remove()">✕</button>
    </div>
    ${bodyHtml}
  </div>`;
  document.body.appendChild(overlay);
};

window.openVenueStandings = function(dateSel, venueSel){
  const d = state.data;
  let seenPools = [];
  DIVISION_ORDER.forEach(k=>{
    const div = d.divisions[k];
    Object.entries(div.pools||{}).forEach(([poolId,pool])=>{
      if(pool.venue !== venueSel) return;
      const hasMatchHere = Object.values(div.matches||{}).some(m=>m.poolId===poolId && m.date===dateSel);
      if(!hasMatchHere) return;
      if((pool.teams||[]).length===0) return;
      seenPools.push({k,poolId,pool});

      bodyHtml += `<div class="section-title" style="margin-top:14px;">${DIVISION_PRESETS[k].short} · ${pool.name}</div>`;

  overlay.innerHTML = `<div class="card" style="max-width:460px;width:100%;max-height:82vh;overflow-y:auto;">
    <div class="flex-between" style="margin-bottom:12px;">
      <strong style="font-size:16px;">${venueSel} 순위표</strong>
      <button class="btn btn-ghost btn-sm" onclick="this.closest('div[style*=fixed]').remove()">✕</button>

function renderSetup(k,div){
  const stages = DIVISION_STAGES[k];
  let html = `<div class="section-title">🏫 우리학교 확인하기</div>
  <div class="small-note" style="margin-bottom:12px;">우리 학교 이름을 검색하거나 눌러서 몇 조인지, 언제 어디서 경기하는지 확인하세요.</div>`;
  const teamCount = Object.keys(div.teams||{}).length;
  html += `<div class="card" style="margin-bottom:12px;"><div style="font-size:12px;color:var(--chalk-dim);">참가 학교</div><div style="font-size:20px;font-weight:800;color:var(--out-orange);">${teamCount}팀</div></div>`;
  html += `<input type="text" id="schoolSearchInput" placeholder="우리 학교 이름 검색 (예: 마석중)" oninput="filterSchoolTags(this.value)" style="margin-bottom:18px;">`;

  stages.forEach((stageDef,si)=>{
    const pools = Object.entries(div.pools||{}).filter(([id,p])=>p.stage===stageDef.key);
    html += `<div class="section-title" style="margin-top:22px;">${stageDef.label}</div>`;
    const isLastStage = si===stages.length-1;
    if(isLastStage){
      html += `<div class="small-note" style="margin-bottom:8px;">이 단계 결과로 최종 순위가 정해집니다.</div>`;
    } else if(k==='girlHs' && stageDef.key==='prelim'){
      html += `<div class="small-note" style="margin-bottom:8px;">조 1위는 자동으로 본선에 진출하고, 조 2위 중 성적이 가장 좋은 1팀이 와일드카드로 추가 진출합니다.</div>`;
    } else if(stageDef.advanceN){
      const nextStage = stages[si+1];
      html += `<div class="small-note" style="margin-bottom:8px;">조 ${stageDef.advanceN}위까지 ${nextStage?nextStage.label:'다음 단계'}에 진출합니다.</div>`;
    }
    const dvText = stageDateVenueText(k, stageDef, div);
    if(dvText) html += `<div class="small-note" style="margin-bottom:8px;color:var(--out-orange);">📅 ${dvText}</div>`;
    const anyTeams = pools.some(([id,p])=>(p.teams||[]).length>0);
    if(!anyTeams){
      html += `<div class="small-note">아직 진출팀이 확정되지 않았습니다.</div>`;
    } else {
      pools.forEach(([id,p])=>{
        const gTeamEntries = (p.teams||[]).map(tid=>[tid, div.teams[tid]]).filter(([tid,t])=>t);
        if(gTeamEntries.length===0) return;
        html += `<div class="group-card">
          <div class="ghead"><div class="gname">${p.name}</div><span class="small-note">${gTeamEntries.length}팀 · ${p.venue||''}</span></div>
          <div class="group-teams">${gTeamEntries.map(([tid,t])=>`<div class="group-team-tag" data-name="${t.name}" style="cursor:pointer;" onclick="openTeamModal('${k}','${tid}')">${t.name}</div>`).join('')}</div>
        </div>`;
      });
    }
  });

  if(state.role==='admin'){
    html += `<div class="small-note" style="margin-top:16px;">💡 본선 진출 확정은 종목 메뉴 화면 상단에서 할 수 있습니다.</div>`;
  }
  return html;
}

function getPoolTop(div, poolId, n){
  const rows = getDisplayStandings(div, poolId);
  return rows.slice(0,n).map(r=>r.id);
}
function isPoolComplete(div, poolId){
  const matches = Object.entries(div.matches||{}).filter(([id,m])=>m.poolId===poolId);
  if(matches.length===0) return false;
  return matches.every(([id,m])=> !m.teamA || !m.teamB || matchStats(m).decided);
}
function isStageComplete(div, stageKey){
  const pools = Object.entries(div.pools||{}).filter(([id,p])=>p.stage===stageKey && (p.teams||[]).length>0);
  if(pools.length===0) return false;
  return pools.every(([id,p])=>isPoolComplete(div,id));
}

function renderAdvancementPanel(k,div){
  if(k==='boyEl') return '';

  if(k==='girlEl'){
    const prelimComplete = isStageComplete(div,'prelim');
    const finalPool = div.pools['p_final'];
    const finalReady = finalPool && (finalPool.teams||[]).length>0;
    if(finalReady) return `<div class="small-note" style="margin-top:16px;">✅ 본선(결승리그) 대진이 생성되었습니다.</div>`;
    if(!prelimComplete) return `<div class="small-note" style="margin-top:16px;">예선이 모두 끝나면 본선 진출팀(조 2위까지)을 확정할 수 있습니다.</div>`;
    return `<div class="card" style="margin-top:16px;border-color:var(--out-orange);">
      <div style="font-weight:800;margin-bottom:6px;">⚡ 본선(결승리그) 대진 생성</div>
      <div class="small-note" style="margin-bottom:10px;">예선 3개조 2위까지, 총 6팀이 토평초에서 결승리그를 치릅니다.</div>
      <button class="btn btn-primary" onclick="advanceGirlElFinal()">본선 대진 생성</button>
    </div>`;
  }

  if(k==='girlMs'){
    const prelimComplete = isStageComplete(div,'prelim');
    const pa = div.pools['p_a'], pb = div.pools['p_b'];
    const semisMatchesExist = Object.values(div.matches||{}).some(m=>m.stage==='semis');
    const grandPool = div.pools['p_grand'];
    const grandReady = grandPool && (grandPool.teams||[]).length>0;

    if(grandReady) return `<div class="small-note" style="margin-top:16px;">✅ 결승 대진이 생성되었습니다.</div>`;

    if(semisMatchesExist){
      const semisComplete = isStageComplete(div,'semis');
      if(!semisComplete) return `<div class="small-note" style="margin-top:16px;">본선1(A/B조) 경기가 끝나면 결승 대진을 만들 수 있습니다.</div>`;
      return `<div class="card" style="margin-top:16px;border-color:var(--out-orange);">
        <div style="font-weight:800;margin-bottom:6px;">⚡ 결승 대진 생성</div>
        <button class="btn btn-primary" onclick="advanceMsFinal()">결승 대진 생성</button>
      </div>`;
    }

    if(!prelimComplete) return `<div class="small-note" style="margin-top:16px;">예선 8개조가 모두 끝나면 본선1(A/B조) 진출팀을 배정할 수 있습니다.</div>`;

    const prelimPools = Object.entries(div.pools).filter(([id,p])=>p.stage==='prelim');
    const winners = prelimPools.map(([id,p])=>({poolName:p.name, id:getPoolTop(div,id,1)[0]})).filter(w=>w.id);
    const curA = (pa&&pa.teams)||[], curB=(pb&&pb.teams)||[];
    let html = `<div class="card" style="margin-top:16px;border-color:var(--out-orange);">
      <div style="font-weight:800;margin-bottom:6px;">⚡ 본선1(A/B조) 진출팀 배정</div>
      <div class="small-note" style="margin-bottom:10px;">각 조 1위(8팀)를 클릭해서 A조 → B조 → 해제 순으로 배정하세요. A조/B조 각 4팀씩 필요합니다.</div>
      <div class="group-teams">`;
    winners.forEach(w=>{
      const inA = curA.includes(w.id), inB = curB.includes(w.id);
      const label = div.teams[w.id]?div.teams[w.id].name:'?';
      const style = inA? 'border-color:var(--draw-blue);color:var(--draw-blue);' : inB? 'border-color:var(--out-orange);color:var(--out-orange);' : '';
      html += `<div class="group-team-tag" style="cursor:pointer;${style}" onclick="toggleMsAssignment('${w.id}')">${label}${inA?' (A)':inB?' (B)':''} <span style="color:var(--chalk-dim);">${w.poolName}</span></div>`;
    });
    html += `</div><div class="small-note" style="margin-top:8px;">A조 ${curA.length}/4 · B조 ${curB.length}/4</div>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="confirmMsSemis()">본선1 대진 생성</button>
    </div>`;
    return html;
  }

  if(k==='girlHs'){
    const prelimComplete = isStageComplete(div,'prelim');
    const finalPool = div.pools['p_final'];
    const finalReady = finalPool && (finalPool.teams||[]).length>0;
    if(finalReady) return `<div class="small-note" style="margin-top:16px;">✅ 본선 대진이 생성되었습니다.</div>`;
    if(!prelimComplete) return `<div class="small-note" style="margin-top:16px;">예선이 모두 끝나면 본선 진출팀(조1위 3팀 + 와일드카드 1팀)을 확정할 수 있습니다.</div>`;

    const prelimPools = Object.entries(div.pools).filter(([id,p])=>p.stage==='prelim');
    const top1s = prelimPools.map(([id,p])=>({poolName:p.name, id:getPoolTop(div,id,1)[0]})).filter(w=>w.id);
    const candidates = [];
    prelimPools.forEach(([id,p])=>{
      const rows = getDisplayStandings(div,id);
      rows.slice(1).forEach(r=> candidates.push({id:r.id, name:r.name, poolName:p.name, pts:r.pts, setScore:r.setScore}) );
    });
    candidates.sort((a,b)=> b.pts-a.pts || b.setScore-a.setScore);
    const curW = finalPool ? finalPool.wildcardPick : null;

    let html = `<div class="card" style="margin-top:16px;border-color:var(--out-orange);">
      <div style="font-weight:800;margin-bottom:6px;">⚡ 본선(전체리그) 진출팀 확정</div>
      <div class="small-note" style="margin-bottom:8px;">자동 진출: ${top1s.map(w=>(div.teams[w.id]?div.teams[w.id].name:'?')+'('+w.poolName+' 1위)').join(', ')}</div>
      <div class="small-note" style="margin-bottom:6px;">와일드카드 1팀을 선택하세요 (승점 높은 순):</div>
      <div class="group-teams">`;
    candidates.forEach(c=>{
      const sel = curW===c.id;
      html += `<div class="group-team-tag" style="cursor:pointer;${sel?'border-color:var(--out-orange);color:var(--out-orange);':''}" onclick="toggleHsWildcard('${c.id}')">${c.name} <span style="color:var(--chalk-dim);">(${c.poolName}·승점${c.pts}·내야${c.setScore})</span></div>`;
    });
    html += `</div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="confirmHsFinal()">본선 대진 생성</button>
    </div>`;
    return html;
  }
  return '';
}

window.advanceGirlElFinal = function(){
  const k='girlEl'; const div = state.data.divisions[k];
  const top1 = getPoolTop(div,'p_해밀',2), top2 = getPoolTop(div,'p_백봉',2), top3 = getPoolTop(div,'p_부양',2);
  if(top1.length<2 || top2.length<2 || top3.length<2){ toast('예선 순위가 아직 확정되지 않은 조가 있습니다'); return; }
  const advancers = [...top1, ...top2, ...top3];
  // 요강 확정본 대진: 예선에서 이미 붙었던 같은 조 1-2위끼리는 재대결 생략
  const template = [
    ['a1','b2','15:30'],['a2','c2','15:40'],['b1','c1','15:50'],
    ['a1','c2','16:10'],['b2','c1','16:20'],['a2','b1','16:30'],
    ['a1','c1','16:40'],['c2','b1','16:50'],['b2','a2','17:10'],
    ['a1','b1','17:20'],['c1','a2','17:30'],['c2','b2','17:40']
  ];
  const slotMap = { a1:top1[0], a2:top1[1], b1:top2[0], b2:top2[1], c1:top3[0], c2:top3[1] };
  const updates = {};
  updates[`divisions/${k}/pools/p_final/teams`] = advancers;
  template.forEach((row,idx)=>{
    const mid='m_final_'+idx;
    updates[`divisions/${k}/matches/${mid}`] = {
      poolId:'p_final', teamA:slotMap[row[0]], teamB:slotMap[row[1]], sets:{}, setsToPlay:2, drawAllowed:true,
      stage:'final', time:row[2], court:'토평초', date:'8/21(금)', status:'scheduled', createdAt: idx
    };
  });
  db.ref('tournaments/'+state.code).update(updates).then(()=>toast('본선(결승리그) 대진이 생성되었습니다'));
};

window.toggleMsAssignment = function(teamId){
  const div = state.data.divisions.girlMs;
  const pa = div.pools.p_a || {teams:[]}, pb = div.pools.p_b || {teams:[]};
  const inA = (pa.teams||[]).includes(teamId);
  const inB = (pb.teams||[]).includes(teamId);
  let newA = (pa.teams||[]).filter(id=>id!==teamId);
  let newB = (pb.teams||[]).filter(id=>id!==teamId);
  if(!inA && !inB){
    if(newA.length>=4){ toast('A조는 이미 4팀입니다'); return; }
    newA.push(teamId);
  } else if(inA){
    if(newB.length>=4){ toast('B조는 이미 4팀입니다'); return; }
    newB.push(teamId);
  }
  db.ref('tournaments/'+state.code+'/divisions/girlMs/pools/p_a/teams').set(newA);
  db.ref('tournaments/'+state.code+'/divisions/girlMs/pools/p_b/teams').set(newB);
};
window.confirmMsSemis = function(){
  const div = state.data.divisions.girlMs;
  const a = (div.pools.p_a&&div.pools.p_a.teams)||[], b=(div.pools.p_b&&div.pools.p_b.teams)||[];

function resolvePoolSelection(k,div){
  const stages = DIVISION_STAGES[k];
  const availableStages = stages.filter(s=> Object.values(div.pools||{}).some(p=>p.stage===s.key && (p.teams||[]).length>0) );
  if(availableStages.length===0) return { empty:true };

  if(availableStages.length>1 && !state.selectedStage){
    return { needStagePick:true, availableStages };
  }
  const stageKey = availableStages.length>1 ? state.selectedStage : availableStages[0].key;
  const stageDef = stages.find(s=>s.key===stageKey);
  const pools = Object.entries(div.pools||{}).filter(([id,p])=>p.stage===stageKey && (p.teams||[]).length>0);

  if(pools.length>1 && !state.selectedGroup){
    return { needPoolPick:true, availableStages, pools, stageDef };
  }
  const poolId = pools.length>1 ? state.selectedGroup : (pools[0] ? pools[0][0] : null);
  const pool = poolId ? div.pools[poolId] : null;
  return { availableStages, pools, stageDef, poolId, pool };
}

window.manualReorder = function(k,poolId,idx,dir){

// ============================================================
// 시간/세트 계산 헬퍼
// ============================================================
function parseTimeToMinutes(t){
  if(!t) return null;
  const s = String(t).trim();
  const hm = s.match(/^(\d{1,2}):(\d{2})/);
  if(hm) return parseInt(hm[1])*60 + parseInt(hm[2]);
  const num = s.match(/^(\d{1,3})$/);
  if(num) return parseInt(num[1]);
  return null;
}
function setResult(setObj){
  if(!setObj || setObj.a===undefined || setObj.a===null || setObj.b===undefined || setObj.b===null) return null;
  const a = Number(setObj.a), b = Number(setObj.b);
  if(a > b) return 'A';
  if(b > a) return 'B';
  return 'tie';
}
function matchStats(m){
  const sets = m.sets||{};
  const setCount = m.setsToPlay||2;
  let winsA=0, winsB=0, played=0, sumA=0, sumB=0;
  for(let i=0;i<setCount;i++){
    const s = sets[i];
    const r = setResult(s);
    if(r===null) continue;
    played++;
    sumA += Number(s.a)||0; sumB += Number(s.b)||0;
    if(r==='A') winsA++;
    else if(r==='B') winsB++;
  }
  // 연장전/골든볼로 승자를 직접 지정한 경우: 세트 수·과반수 계산과 무관하게 그 결과를 그대로 확정합니다.
  if(m.forcedWinner==='A' || m.forcedWinner==='B'){
    return {winsA,winsB,played,setCount,decided:true,winner:m.forcedWinner,sumA,sumB};
  }
  const decided = !m.drawAllowed ? (winsA>Math.floor(setCount/2) || winsB>Math.floor(setCount/2)) : (played===setCount);
  let winner = null;
  if(decided && played>0){
    if(winsA>winsB) winner='A';
    else if(winsB>winsA) winner='B';
    else winner='draw';
  }
  return {winsA,winsB,played,setCount,decided,winner,sumA,sumB};
}
function teamName(div,id){ return id && div.teams && div.teams[id] ? div.teams[id].name : (id? id : '미정'); }

function computeStandings(div, poolId){
  const pool = div.pools[poolId];
  const teamIds = (pool && pool.teams) || [];
  const matches = Object.entries(div.matches||{}).filter(([id,m])=>m.poolId===poolId);
  const table = {};
  teamIds.forEach(id=>{ const t=div.teams[id]; if(t) table[id]={id,name:t.name,played:0,win:0,draw:0,lose:0,pts:0,setScore:0}; });
  matches.forEach(([mid,m])=>{
    if(!m.teamA||!m.teamB) return;
    const st = matchStats(m);
    if(st.played===0 || !st.decided) return;
    const A=table[m.teamA], B=table[m.teamB];
    if(!A||!B) return;
    A.played++; B.played++;
    A.setScore += st.sumA; B.setScore += st.sumB;
    if(st.winsA>st.winsB){ A.win++; A.pts+=3; B.lose++; }
    else if(st.winsB>st.winsA){ B.win++; B.pts+=3; A.lose++; }
    else { A.draw++; B.draw++; A.pts+=1; B.pts+=1; }
  });
  let arr = Object.values(table);
  arr.sort((a,b)=> b.pts-a.pts || b.setScore-a.setScore);

  // 동률 구간(승점·내야득점수까지 같은 팀들)을 찾아서, 정확히 2팀만 동률이면
  // 맞대결(승자승) 결과로 자동 순서를 정합니다. 3팀 이상 동률이면 수동 조정 대상으로 남겨둡니다.
  let i=0;
  while(i<arr.length){
    let j=i+1;
    while(j<arr.length && arr[j].pts===arr[i].pts && arr[j].setScore===arr[i].setScore) j++;
    const clusterSize = j-i;
    if(clusterSize>=2){
      for(let x=i;x<j;x++) arr[x].tied = true;
      if(clusterSize===2){
        const a = arr[i], b = arr[i+1];
        const h2h = matches.map(([mid,m])=>m).find(m=> (m.teamA===a.id && m.teamB===b.id) || (m.teamA===b.id && m.teamB===a.id));
        if(h2h){
          const hst = matchStats(h2h);
          if(hst.decided && hst.winner!=='draw'){
            const aIsTeamA = h2h.teamA===a.id;
            const aWon = (aIsTeamA && hst.winner==='A') || (!aIsTeamA && hst.winner==='B');
            arr[i].h2hResolved = true; arr[i+1].h2hResolved = true;
            if(!aWon){ arr[i]=b; arr[i+1]=a; }
          }
        }
      }
    }
    i=j;
  }
  return arr;
}
function getDisplayStandings(div, poolId){
  const base = computeStandings(div, poolId);
  const pool = div.pools[poolId];
  const manualOrder = pool && pool.manualOrder;
  if(!manualOrder) return base;
  const byId = {}; base.forEach(r=>{ byId[r.id]=r; });
  const ordered = manualOrder.map(id=>byId[id]).filter(Boolean);
  base.forEach(r=>{ if(!manualOrder.includes(r.id)) ordered.push(r); });
  return ordered;
}

}
window.toggleChecklistItem = function(k, teamId, itemKey, value){
  db.ref(`tournaments/${state.code}/divisions/${k}/teams/${teamId}/checklist/${itemKey}`).set(value);
};

// ============================================================
// 장소별 진행 현황
// ============================================================
function renderVenueView(d){
  // 실제 생성된 경기(matches)와, 아직 대진이 안 만들어졌어도 예정된 장소(pools의 venue)를
  // 합쳐서 날짜별 장소 목록을 구성합니다. 이렇게 하면 본선처럼 예선 결과가 나와야
  // 대진이 생기는 단계도 "몇월 며칠에 어디서 하는지"는 미리 보여줄 수 있습니다.
  let all = [];
  DIVISION_ORDER.forEach(k=>{
    const div = d.divisions[k];
    Object.entries(div.matches||{}).forEach(([mid,m])=>{
      if(m.court) all.push({k,mid,m,div});
    });
  });

  let planned = {}; // date -> venue -> { hasTeams, matchCount, divisions:Set }
  DIVISION_ORDER.forEach(k=>{
    const div = d.divisions[k];
    (DIVISION_STAGES[k]||[]).forEach(stageDef=>{
      const date = (DIVISION_STAGE_DATES[k]||{})[stageDef.key];
      if(!date) return;
      Object.values(div.pools||{}).filter(p=>p.stage===stageDef.key).forEach(p=>{
        if(!p.venue) return;
        planned[date] = planned[date] || {};
        const cur = planned[date][p.venue] || { hasTeams:false, matchCount:0, divisions:new Set() };
        if((p.teams||[]).length>0) cur.hasTeams = true;
        cur.divisions.add(DIVISION_PRESETS[k].short);
        planned[date][p.venue] = cur;
      });
    });
  });
  all.forEach(x=>{
    const date=x.m.date, venue=x.m.court;
    if(!date || !venue) return;
    planned[date] = planned[date] || {};
    const cur = planned[date][venue] || { hasTeams:true, matchCount:0, divisions:new Set() };
    cur.matchCount++;
    cur.divisions.add(DIVISION_PRESETS[x.k].short);
    planned[date][venue] = cur;
  });

  const dates = Object.keys(planned).sort((a,b)=> DATE_ORDER.indexOf(a)-DATE_ORDER.indexOf(b));

  if(!state.selectedVenue){
    let html = `<div class="section-title" style="margin-top:8px;">🏐 장소별 진행 현황</div>
    <div class="small-note" style="margin-bottom:14px;">날짜와 장소를 선택하세요. 흐리게 표시된 장소는 이전 단계 결과가 나와야 대진이 만들어져요.</div>`;
    if(dates.length===0) html += `<div class="small-note">아직 등록된 경기 장소가 없습니다.</div>`;
    dates.forEach(date=>{
      html += `<div class="section-title" style="margin-top:20px;">📅 ${date}</div><div class="group-picker-grid">`;
      Object.entries(planned[date]).forEach(([v,info])=>{
        const pending = !info.hasTeams;
        const divTag = [...info.divisions].join(', ');
        html += `<div class="division-card" style="text-align:center;${pending?'opacity:0.6;':''}" onclick='state.selectedVenue={"date":"${date}","venue":"${v}"};paintMain()'>
          <div class="dtitle">${v}</div>
          <div class="dmeta" style="color:var(--out-orange);font-weight:600;">${divTag}</div>
          <div class="dmeta">${pending?'대진 예정':info.matchCount+'경기'}</div>
        </div>`;
      });
      html += `</div>`;
    });
    return html;
  }

  const dateSel = state.selectedVenue.date, venueSel = state.selectedVenue.venue;
  let matches = all.filter(x=>x.m.date===dateSel && x.m.court===venueSel);
  matches.sort((a,b)=>{
    const ta=parseTimeToMinutes(a.m.time), tb=parseTimeToMinutes(b.m.time);
    if(ta!==null && tb!==null && ta!==tb) return ta-tb;
    if(ta!==null && tb===null) return -1;
    if(ta===null && tb!==null) return 1;
    return 0;
  });

  let html = `<div class="flex-between" style="margin-bottom:14px;">
    <button class="btn btn-ghost btn-sm" onclick="state.selectedVenue=null;paintMain()">&larr; 장소 목록</button>
    <div style="font-weight:800;">${venueSel}</div>
    <button class="btn btn-sm btn-primary" onclick='openVenueStandings("${dateSel}","${venueSel}")'>🏆 순위표</button>
  </div>
  <div class="small-note" style="margin-bottom:10px;">${dateSel} · 주황색으로 강조된 경기가 현재 진행중입니다.</div>`;

  if(matches.length===0){
    const pendingHere = planned[dateSel] && planned[dateSel][venueSel] && !planned[dateSel][venueSel].hasTeams;
    html += pendingHere
      ? `<div class="empty-state"><div class="big">🏐</div>이 날짜 경기는 이전 단계(예선) 결과에 따라 진출팀이 정해진 뒤에 대진이 만들어져요.<br>예선이 끝나면 여기에 자동으로 표시됩니다.</div>`
      : `<div class="empty-state"><div class="big">🏐</div>이 장소에 경기가 없습니다.</div>`;
  } else {
    matches.forEach(({k,mid,m,div},idx)=>{
      const st = matchStats(m);
      const isLive = st.played>0 && !st.decided;
      const stageDef = (DIVISION_STAGES[k]||[]).find(s=>s.key===m.stage);
      const stageTag = (stageDef && stageDef.key!=='league') ? stageDef.label : '';
      const poolName = div.pools[m.poolId] ? div.pools[m.poolId].name : '';
      html += `<div style="${isLive?'border:3px solid var(--out-orange);border-radius:12px;':''}">
        <div style="padding:2px 6px 0;font-size:11px;color:var(--chalk-dim);">${[DIVISION_PRESETS[k].short, stageTag, poolName].filter(Boolean).join(' · ')}</div>
        ${renderMatchCard(k,mid,m,div,{showTimeCourtInputs:false, showScoreEntry:true, orderLabel:(idx+1)+'경기'})}
      </div>`;
    });
  }
  return html;
}

// ============================================================
// 경기 카드 (공통) - 세트별 내야 득점 입력, 승/패/무 자동 판정
// ============================================================
function renderMatchCard(k,mid,m,div,opts){
  opts = opts || {};
  const showTimeCourtInputs = opts.showTimeCourtInputs!==undefined ? opts.showTimeCourtInputs : true;
  const showScoreEntry = opts.showScoreEntry!==undefined ? opts.showScoreEntry : true;
  const emphasizeTimeCourt = opts.emphasizeTimeCourt || false;
  const orderLabel = opts.orderLabel || '';
  const isAdmin = state.role==='admin';
  const nameA = teamName(div,m.teamA), nameB = teamName(div,m.teamB);
  const sets = m.sets||{};
  const setCount = m.setsToPlay||2;
  const st = matchStats(m);
  const winsA = st.winsA, winsB = st.winsB;
  const winner = st.winner;
  const stageDef = (DIVISION_STAGES[k]||[]).find(s=>s.key===m.stage);
  const stageLabel = (stageDef && stageDef.key!=='league') ? stageDef.label : '';
  let status = 'scheduled';
  if(st.played>0 && !st.decided) status='live';
  if(st.decided && st.played>0) status='done';
  const topLabelParts = [stageLabel];
  if(!emphasizeTimeCourt){
    if(orderLabel) topLabelParts.push(orderLabel);
    if(m.court) topLabelParts.push(m.court);
  }
  let html = `<div class="match-card">
    <div class="match-top">
      <span class="match-group-label">${topLabelParts.filter(Boolean).join(' · ')}</span>
      <span class="status-pill ${status}">${status==='done'?'종료':status==='live'?'진행중':'예정'}</span>
    </div>`;
  if(emphasizeTimeCourt && (orderLabel || m.court)){
    html += `<div style="text-align:center;font-weight:800;font-size:19px;color:var(--out-orange);margin-bottom:10px;">${orderLabel?orderLabel:''}${orderLabel&&m.court?' · ':''}${m.court?m.court:''}</div>`;
  }
  if(isAdmin && showTimeCourtInputs){
    html += `<div style="display:flex;gap:6px;margin-bottom:8px;">
      <input type="text" value="${m.time||''}" placeholder="경기 순서 (예: 1, 2, 3)" onchange="setMatchTime('${k}','${mid}',this.value)" style="flex:1;padding:6px 8px;background:var(--court-bg);color:var(--chalk);border:1px solid var(--line);border-radius:6px;font-size:12px;">
      <input type="text" value="${m.court||''}" placeholder="경기장소 (예: 다산초)" onchange="setMatchCourt('${k}','${mid}',this.value)" style="flex:1;padding:6px 8px;background:var(--court-bg);color:var(--chalk);border:1px solid var(--line);border-radius:6px;font-size:12px;">
    </div>`;
  }
  const winBadge = ` <span style="background:var(--in-green);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:4px;">승</span>`;
  const loseBadge = ` <span style="background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:4px;">패</span>`;
  html += `<div class="teams-row">
      <span class="tname ${winner==='A'?'winner':''}">${nameA}${winner==='A'?winBadge:''}${winner==='B'?loseBadge:''}</span>
      <span class="vs" ${winner==='draw'?'style="color:var(--draw-blue);font-weight:800;font-size:16px;"':''}>${winner==='draw'?'무':'VS'}</span>
      <span class="tname ${winner==='B'?'winner':''}">${nameB}${winner==='B'?winBadge:''}${winner==='A'?loseBadge:''}</span>
    </div>`;
  if(m.teamA && m.teamB){
    if(showScoreEntry){
      if(isAdmin){
        html += `<div class="small-note" style="text-align:center;margin-bottom:6px;">내야에 남은 학생 수 입력</div>`;
      }
      html += `<div class="sets-row">`;
      for(let i=0;i<setCount;i++){
        const s = sets[i];
        const r = setResult(s);
        const valA = (s && s.a!==undefined && s.a!==null) ? s.a : '';
        const valB = (s && s.b!==undefined && s.b!==null) ? s.b : '';
        html += `<div class="set-box">
          <div class="set-label">SET ${i+1}</div>
          <div style="display:flex;gap:4px;justify-content:center;align-items:flex-end;">
            <div style="text-align:center;">
              <div style="font-size:9px;color:var(--chalk-dim);margin-bottom:2px;">${nameA.slice(0,3)}</div>
              <input type="number" min="0" max="20" inputmode="numeric" class="score-input" value="${valA}" ${isAdmin?`onchange="setSetScore('${k}','${mid}',${i},'a',this.value)"`:'disabled'} style="width:40px;padding:4px 2px;text-align:center;background:var(--court-bg);color:var(--chalk);border:1px solid var(--line);border-radius:4px;font-size:13px;">
            </div>
            <span style="color:var(--chalk-dim);font-size:11px;padding-bottom:6px;">:</span>
            <div style="text-align:center;">
              <div style="font-size:9px;color:var(--chalk-dim);margin-bottom:2px;">${nameB.slice(0,3)}</div>
              <input type="number" min="0" max="20" inputmode="numeric" class="score-input" value="${valB}" ${isAdmin?`onchange="setSetScore('${k}','${mid}',${i},'b',this.value)"`:'disabled'} style="width:40px;padding:4px 2px;text-align:center;background:var(--court-bg);color:var(--chalk);border:1px solid var(--line);border-radius:4px;font-size:13px;">
            </div>
          </div>
          ${r?`<div style="text-align:center;font-size:10px;margin-top:4px;font-weight:700;color:${r==='A'?'var(--in-green)':r==='B'?'var(--danger)':'var(--draw-blue)'};">${r==='A'?nameA.slice(0,4)+' 승':r==='B'?nameB.slice(0,4)+' 승':'무'}</div>`:''}
        </div>`;
      }
      html += `</div>`;
      if(winner==='draw' && status==='done'){
        html += `<div class="small-note" style="text-align:center;">세트 무승부 — 승점 1:1 처리됩니다.</div>`;
      }
      if(m.forcedWinner){
        html += `<div class="small-note" style="text-align:center;color:var(--out-orange);">⚡ 연장전/골든볼로 승자가 결정된 경기입니다.</div>`;
      }
      if(isAdmin && !m.drawAllowed && st.played===setCount && winsA===winsB && !m.forcedWinner){
        html += `<div class="match-actions">
          <span class="small-note">동률! 연장전/골든볼 결과로 승자를 지정하세요:</span>
        </div>
        <div class="match-actions">
          <button class="btn btn-sm" onclick="forceWinner('${k}','${mid}','A')">${nameA} 승</button>
          <button class="btn btn-sm" onclick="forceWinner('${k}','${mid}','B')">${nameB} 승</button>
        </div>`;
      }
    }
    if(isAdmin && showScoreEntry){
      html += `<div class="match-actions"><button class="btn btn-ghost btn-sm" onclick="resetMatch('${k}','${mid}')">경기 초기화</button></div>`;
    }
  } else {
    html += `<div class="small-note" style="text-align:center;">대진 확정 대기중</div>`;
  }
  html += `</div>`;
  return html;
}

window.setMatchCourt = function(k,mid,value){
  db.ref(`tournaments/${state.code}/divisions/${k}/matches/${mid}/court`).set(value || null);
};
window.setMatchTime = function(k,mid,value){
  db.ref(`tournaments/${state.code}/divisions/${k}/matches/${mid}/time`).set(value || null);
};
window.setSetScore = function(k, mid, setIdx, side, value){
  const num = (value==='' || value===null || value===undefined) ? null : Math.max(0, parseInt(value)||0);
  db.ref(`tournaments/${state.code}/divisions/${k}/matches/${mid}/sets/${setIdx}/${side}`).set(num);
};
window.forceWinner = function(k,mid,winner){
  db.ref(`tournaments/${state.code}/divisions/${k}/matches/${mid}/forcedWinner`).set(winner);
};
window.resetMatch = function(k,mid){
  if(!confirm('입력한 점수를 초기화할까요? 되돌릴 수 없습니다.')) return;
  db.ref(`tournaments/${state.code}/divisions/${k}/matches/${mid}/sets`).set(null);
  db.ref(`tournaments/${state.code}/divisions/${k}/matches/${mid}/forcedWinner`).set(null);
};

// ============================================================
loadLocal();
render();
</script>
